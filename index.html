<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta id="themeColor" name="theme-color" content="#090d18">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Control sencillo de dinero, ahorro y dinero ajeno, privado y sin conexión">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Control">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./simple-money-v2.css">
  <title>Mi Control de gasto</title>
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-content">
      <h2>Mi Control de gasto</h2>
      <i></i>
      <p>Luis Pineda</p>
    </div>
  </div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">▥</span>
      <div class="brand-copy">
        <h1>Mi Control de gasto</h1>
        <small>Luis Pineda</small>
      </div>
    </div>
    <button id="themeQuick" class="icon" type="button" aria-label="Cambiar tema" aria-pressed="false">◐</button>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="bottom" aria-label="Navegación principal">
    <button type="button" data-page="home" class="active" aria-label="Resumen" aria-current="page"><span>⌂</span><b>Resumen</b></button>
    <button type="button" data-page="moves" aria-label="Movimientos"><span>↕</span><b>Movimientos</b></button>
    <button type="button" data-page="register" class="primary" aria-label="Registrar"><span>＋</span><b>Registrar</b></button>
    <button type="button" data-page="money" aria-label="Mi dinero"><span>◉</span><b>Mi dinero</b></button>
    <button type="button" data-page="savings" aria-label="Ahorro"><span>🌱</span><b>Ahorro</b></button>
    <button type="button" data-page="settings" aria-label="Ajustes"><span>⚙</span><b>Ajustes</b></button>
    <div class="privacy-card" aria-hidden="true">
      <span>♢</span>
      <div><strong>Datos 100% privados</strong><small>Guardados solo en tu dispositivo</small></div>
    </div>
  </nav>

  <dialog id="modal" aria-labelledby="modalTitle">
    <button id="modalClose" class="close" type="button" aria-label="Cerrar">×</button>
    <div id="modalBody"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/simple-money-v2.js"></script>
</body>
</html>
